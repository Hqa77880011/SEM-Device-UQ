[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sem-uncertainty"
version = "0.1.0"
description = "Uncertainty Propagation from SEM Boundaries to MOSFET Electrical Characteristics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10", "arviz>=0.16"]

[project.scripts]
sem-uncertainty = "sem_uncertainty.cli:main"

[tool.setuptools.packages.find]
include = ["sem_uncertainty*"]
